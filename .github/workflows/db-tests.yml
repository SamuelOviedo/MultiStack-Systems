name: DB tests

# RLS / privilege regression gate: runs the pgTAP suites in supabase/tests
# against an isolated, throwaway local Supabase stack (Postgres + Auth) built
# from this branch's migrations and seed. Never touches a remote project.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: db-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pgtap:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Start isolated local stack (migrations + seed)
        run: >
          supabase start
          -x studio,imgproxy,vector,logflare,realtime,storage-api,edge-runtime,supavisor,postgres-meta,mailpit

      - name: Run pgTAP suites
        run: supabase test db

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
