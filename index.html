<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply persisted theme before paint to avoid a light/dark flash.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var d = t ? t === "dark" : true; // default dark
          document.documentElement.classList.toggle("dark", d);
        } catch (e) {}
      })();
    </script>
    <script>
      // Landing only: preload the hero poster (LCP candidate) at high priority.
      // Injected by script so SPA routes like /dashboard never download it.
      // Keep in sync with src/lib/cinematicScenes.ts.
      (function () {
        if (location.pathname !== "/") return;
        var l = document.createElement("link");
        l.rel = "preload";
        l.as = "image";
        l.type = "image/webp";
        l.setAttribute("imagesrcset", "/assets/posters/hero.720.webp 1280w, /assets/posters/hero.1080.webp 1920w");
        l.setAttribute("imagesizes", "100vw");
        l.setAttribute("fetchpriority", "high");
        document.head.appendChild(l);
      })();
    </script>
